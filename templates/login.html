{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow p-4">

<h2 class="text-center">
🔐 Login
</h2>

<form method="POST">


<label>Email</label>

<input
type="email"
name="email"
class="form-control mb-3"
required>


<label>Password</label>

<input
type="password"
name="password"
class="form-control mb-3"
required>


<button
class="btn btn-primary w-100">

Login

</button>


</form>


<p class="text-center mt-3">

Don't have an account?

<a href="/signup">
Signup
</a>

</p>

</div>

</div>

</div>

{% endblock %}
