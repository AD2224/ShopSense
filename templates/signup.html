{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow p-4">

<h2 class="text-center">
Create Account
</h2>

<form method="POST">


<label>Name</label>

<input
type="text"
name="name"
class="form-control mb-3"
required>


<label>Email</label>

<input
type="email"
name="email"
class="form-control mb-3"
required>


<label>Password</label>

<input
type="password"
name="password"
class="form-control mb-3"
minlength="6"
required>


<button
class="btn btn-success w-100">

Create Account

</button>


</form>


<p class="text-center mt-3">

Already have an account?

<a href="/login">
Login
</a>

</p>

</div>

</div>

</div>

{% endblock %}
